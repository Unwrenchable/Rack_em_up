# Render Blueprint for rackup-backend (NOT docker-compose).
# Local DB/Redis stays in docker-compose.yml on your laptop.
# After push: Render Dashboard -> Blueprints -> sync this file.

# Postgres now lives off Render (roc-db-moot-knoll.sage.cloud.layerbase.dev).
# rackup-backend no longer reads DATABASE_URL from this database. Keep this
# block only until the cutover smoke passes and the Render DB is deleted.
databases:
  - name: rackup-db
    postgresMajorVersion: "15"
    plan: free
    databaseName: rackup
    user: rackup
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: rackup-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: rackup-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # TYPEORM_SYNC is intentionally not set. Production code forces
      # synchronize=false even if the dashboard still has TYPEORM_SYNC=true.
      # Dashboard env vars are not changed by this file. Do not add TYPEORM_SYNC=true.
      - key: PORT
        value: "8080"
      # Full postgres:// URL for the external DB. Dashboard secret, never commit.
      # sync: false so a Blueprint sync never repoints this at Render Postgres.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: rackup-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://www.rackofchampions.com,https://rackofchampions.com,https://roc-xsnc.onrender.com
      # Required signing secrets. Set long random values in the Dashboard.
      # sync: false so a Blueprint sync never overwrites them. Never commit values.
      # If this service ever booted with the old hard-coded JWT defaults, rotate both.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
