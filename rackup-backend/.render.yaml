services:
  - type: web
    name: rackup-backend
    env: node
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # Paste the Internal Database URL from the Render Postgres service.
      # Must start with postgres:// or postgresql:// — never host=base.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
