services:
  - type: web
    name: rackup-backend
    env: node
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    # NODE_ENV=production would skip devDependencies (incl. @types/*) and break nest build.
    # --include=dev keeps TypeScript / Express typings available for compilation.
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: your-database-url-here
      - key: REDIS_URL
        value: your-redis-url-here
