# Render Blueprint for rackup-backend (NOT docker-compose).
# Local DB/Redis stays in docker-compose.yml on your laptop.
# After push: Render Dashboard -> Blueprints -> sync this file.

databases:
  - name: rackup-db
    postgresMajorVersion: "15"
    plan: free
    databaseName: rackup
    user: rackup
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: rackup-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: rackup-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: rackup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rackup-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://www.rackofchampions.com,https://rackofchampions.com,https://roc-xsnc.onrender.com
