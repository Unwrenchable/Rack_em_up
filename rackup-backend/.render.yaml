services:
  - type: web
    name: rackup-backend
    env: node
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    # Install all deps (including build tooling). nest is in dependencies for prod builds.
    buildCommand: npm ci || npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: your-database-url-here
      - key: REDIS_URL
        value: your-redis-url-here
