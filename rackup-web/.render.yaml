services:
  - type: web
    name: rackup-web
    runtime: static
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci || npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Baked into the Vite client at build time — must match api.ts (VITE_API_URL / VITE_WS_URL).
      - key: VITE_API_URL
        value: https://api.rackofchampions.com/api/v1
      - key: VITE_WS_URL
        value: https://api.rackofchampions.com
