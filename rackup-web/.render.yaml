services:
  - type: web
    name: rackup-web
    runtime: static
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci || npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    # SPA: client routes like /auth must rewrite to index.html (else hard 404).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the Vite client at build time - values must be URLs ONLY
      # (not "VITE_API_URL=https://..."). api.ts + vite.config also scrub a bad paste.
      - key: VITE_API_URL
        value: https://api.rackofchampions.com/api/v1
      - key: VITE_WS_URL
        value: https://api.rackofchampions.com
