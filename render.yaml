# Live Render Blueprint for this monorepo (NOT docker-compose).
# Local DB/Redis stays in docker-compose.yml on your laptop.
#
# After merge: Render Dashboard → Blueprints → open this file's Blueprint →
# Sync / Manual Sync so rackup-web picks up SPA rewrite routes + MIME headers.
#
# TRAVIS — live www.rackofchampions.com still returned HTTP 404 for /play
# (and /coach, /shots, /find, …) on 2026-09-16. That means the Blueprint
# rewrite from PR #37 has not been applied to the Static Site that actually
# serves www. If this Blueprint is NOT attached to that service (dashboard-
# created site), do NOT let Sync create a second site. On the existing
# rackup-web service that owns the custom domain:
#
#   Redirects/Rewrites → Add
#     Source: /*    Destination: /index.html    Action: Rewrite
#   Headers (if still needed after deploy)
#     /manifest.webmanifest  Content-Type: application/manifest+json
#     /manifest.json         Content-Type: application/manifest+json
#     /robots.txt            Content-Type: text/plain; charset=utf-8
#     /sitemap.xml           Content-Type: application/xml
#
# That CDN rewrite is what turns /play from HTTP 404 into 200 text/html.
# public/_redirects is Netlify-only — Render ignores it.
# robots.txt + sitemap.xml are real files in rackup-web/public/ (copied to
# dist/). Existing files are served as-is; /* → /index.html is the fallback
# for SPA routes that are not files.

databases:
  - name: rackup-db
    postgresMajorVersion: "15"
    plan: free
    databaseName: rackup
    user: rackup
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: rackup-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: rackup-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: rackup-backend
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: rackup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rackup-redis
          type: keyvalue
          property: connectionString
      # RealAI stays an external Render service (not this monorepo).
      # Host + names match rackup-backend/.env.example and realai-endpoint.ts.
      - key: REALAI_BASE_URL
        value: https://realai-api.onrender.com
      - key: REALAI_COACH_PATH
        value: /v1/plugins/rackup-coach
      # Dashboard secrets — Nest sends Authorization + X-RackUp-Tenant.
      - key: REALAI_API_KEY
        sync: false
      - key: RACKUP_TENANT
        sync: false

  # SPA on Render Static Sites: missing files otherwise serve dist/404.html
  # with HTTP 404 (same HTML as /, verified live 2026-09-13 and still 404
  # on /play 2026-09-16 until Travis applies the rewrite on the live service).
  # rootDir is repository-relative (never relative to a nested yaml path).
  - type: web
    name: rackup-web
    runtime: static
    region: oregon
    plan: starter
    rootDir: rackup-web
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Live .webmanifest was binary/octet-stream (nosniff → PWA install fails).
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml
    envVars:
      # Baked into the Vite client at build time — URLs ONLY
      # (not "VITE_API_URL=https://..."). api.ts + vite.config also scrub a bad paste.
      - key: VITE_API_URL
        value: https://api.rackofchampions.com/api/v1
      - key: VITE_WS_URL
        value: https://api.rackofchampions.com
