# Live Render Blueprint for this monorepo (NOT docker-compose).
# Local DB/Redis stays in docker-compose.yml on your laptop.
#
# After merge: Render Dashboard → Blueprints → open this file's Blueprint →
# Sync / Manual Sync so rackup-web picks up SPA rewrite routes.
#
# If the live www.rackofchampions.com Static Site is NOT in this Blueprint
# (dashboard-created), do NOT let Sync create a second site. Instead, on the
# existing rackup-web service: Redirects/Rewrites → add
#   Source: /*   Destination: /index.html   Action: Rewrite
# That CDN rule is what turns /play from HTTP 404 into 200 text/html.
# public/_redirects is Netlify-only — Render ignores it.

databases:
  - name: rackup-db
    postgresMajorVersion: "15"
    plan: free
    databaseName: rackup
    user: rackup
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: rackup-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: rackup-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: rackup-backend
    buildCommand: npm ci --include=dev || npm install --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: rackup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rackup-redis
          type: keyvalue
          property: connectionString
      # RealAI stays an external Render service (not this monorepo).
      # Host + names match rackup-backend/.env.example and realai-endpoint.ts.
      - key: REALAI_BASE_URL
        value: https://realai-api.onrender.com
      - key: REALAI_COACH_PATH
        value: /v1/plugins/rackup-coach
      # Dashboard secrets — Nest sends Authorization + X-RackUp-Tenant.
      - key: REALAI_API_KEY
        sync: false
      - key: RACKUP_TENANT
        sync: false

  # SPA on Render Static Sites: missing files otherwise serve dist/404.html
  # with HTTP 404 (same HTML as /, verified live 2026-09-13). A rewrite
  # returns index.html with 200 so /play, /shots, /chat, … deep-link.
  # rootDir is repository-relative (never relative to a nested yaml path).
  - type: web
    name: rackup-web
    runtime: static
    region: oregon
    plan: starter
    rootDir: rackup-web
    buildCommand: npm ci || npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Baked into the Vite client at build time — URLs ONLY
      # (not "VITE_API_URL=https://..."). api.ts + vite.config also scrub a bad paste.
      - key: VITE_API_URL
        value: https://api.rackofchampions.com/api/v1
      - key: VITE_WS_URL
        value: https://api.rackofchampions.com
